[package]
name = "scribetray"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
description = "Windows system-tray dictation powered by ElevenLabs Scribe"
default-run = "scribetray"
build = "build.rs"

[dependencies]
cpal = "0.18.2"
base64 = "0.22.1"
directories = "6.0.0"
futures-util = "0.3.31"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart", "rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-native-roots"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.5.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
opt-level = "z"
